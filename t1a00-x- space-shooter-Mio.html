```html
<!DOCTYPE html>
<html>
<head>
    <title>t1a00-x-space-shooter-Mio.html</title>

    <style>
        body {
            margin: 0;
            background: #05051a;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            color: cyan;
            text-shadow: 0 0 15px cyan;
        }

        canvas {
            background: linear-gradient(#080825, #151540);
            border: 3px solid cyan;
            box-shadow: 0 0 20px cyan;
            display: block;
            margin: 15px auto;
            max-width: 95%;
        }

        button {
            background: cyan;
            color: black;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: white;
            box-shadow: 0 0 15px cyan;
        }

        p {
            color: #00ffff;
        }
    </style>
</head>

<body>

    <h1>🚀 MIO SPACE SHOOTER 🚀</h1>

    <p>
        Score: <span id="score">0</span> |
        Lives: <span id="lives">3</span>
    </p>

    <canvas id="game" width="600" height="450"></canvas>

    <p>Use LEFT and RIGHT arrows to move.</p>
    <p>Press SPACE to shoot!</p>

    <button onclick="restartGame()">RESTART GAME</button>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        let player, bullets, enemies, stars;
        let score, lives, gameOver;
        let keys = {};

        function restartGame() {
            player = {
                x: 280,
                y: 390,
                width: 40,
                height: 35,
                speed: 6
            };

            bullets = [];
            enemies = [];
            stars = [];

            score = 0;
            lives = 3;
            gameOver = false;

            for (let i = 0; i < 80; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    speed: Math.random() * 2 + 1
                });
            }

            document.getElementById("score").innerText = score;
            document.getElementById("lives").innerText = lives;

            gameLoop();
        }

        document.addEventListener("keydown", function(e) {
            keys[e.code] = true;

            if (e.code === "Space") {
                e.preventDefault();
            }
        });

        document.addEventListener("keyup", function(e) {
            keys[e.code] = false;
        });

        function drawPlayer() {
            ctx.fillStyle = "#00ffff";
            ctx.shadowColor = "cyan";
            ctx.shadowBlur = 15;

            ctx.beginPath();
            ctx.moveTo(player.x + 20, player.y);
            ctx.lineTo(player.x, player.y + 35);
            ctx.lineTo(player.x + 40, player.y + 35);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur = 0;
        }

        function drawStars() {
            ctx.fillStyle = "white";

            stars.forEach(star => {
                ctx.fillRect(star.x, star.y, 2, 2);

                star.y += star.speed;

                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });
        }

        function shoot() {
            bullets.push({
                x: player.x + 18,
                y: player.y,
                speed: 8
            });
        }

        let shootCooldown = 0;

        function drawBullets() {
            ctx.fillStyle = "yellow";
            ctx.shadowColor = "yellow";
            ctx.shadowBlur = 10;

            bullets.forEach(bullet => {
                ctx.fillRect(bullet.x, bullet.y, 5, 12);
                bullet.y -= bullet.speed;
            });

            bullets = bullets.filter(b => b.y > 0);

            ctx.shadowBlur = 0;
        }

        function spawnEnemy() {
            enemies.push({
                x: Math.random() * 560,
                y: -30,
                size: 30,
                speed: 2 + Math.random() * 2
            });
        }

        function drawEnemies() {
            ctx.fillStyle = "#ff3366";
            ctx.shadowColor = "red";
            ctx.shadowBlur = 12;

            enemies.forEach(enemy => {
                ctx.fillRect(
                    enemy.x,
                    enemy.y,
                    enemy.size,
                    enemy.size
                );

                enemy.y += enemy.speed;
            });

            ctx.shadowBlur = 0;
        }

        function checkCollisions() {
            bullets.forEach((bullet, bi) => {
                enemies.forEach((enemy, ei) => {

                    if (
                        bullet.x < enemy.x + enemy.size &&
                        bullet.x + 5 > enemy.x &&
                        bullet.y < enemy.y + enemy.size &&
                        bullet.y + 12 > enemy.y
                    ) {
                        enemies.splice(ei, 1);
                        bullets.splice(bi, 1);

                        score += 10;

                        document.getElementById("score").innerText = score;
                    }
                });
            });

            enemies.forEach((enemy, i) => {
                if (
                    enemy.y + enemy.size > player.y &&
                    enemy.x < player.x + player.width &&
                    enemy.x + enemy.size > player.x
                ) {
                    enemies.splice(i, 1);
                    lives--;

                    document.getElementById("lives").innerText = lives;

                    if (lives <= 0) {
                        gameOver = true;
                    }
                }

                if (enemy.y > canvas.height) {
                    enemies.splice(i, 1);
                }
            });
        }

        let enemyTimer = 0;

        function gameLoop() {
            if (gameOver) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "white";
                ctx.font = "40px Arial";
                ctx.fillText("GAME OVER!", 175, 200);

                ctx.font = "24px Arial";
                ctx.fillText("Final Score: " + score, 220, 245);

                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawStars();

            if (keys["ArrowLeft"] && player.x > 0) {
                player.x -= player.speed;
            }

            if (keys["ArrowRight"] && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }

            if (keys["Space"] && shootCooldown <= 0) {
                shoot();
                shootCooldown = 12;
            }

            if (shootCooldown > 0) {
                shootCooldown--;
            }

            enemyTimer++;

            if (enemyTimer > 45) {
                spawnEnemy();
                enemyTimer = 0;
            }

            drawPlayer();
            drawBullets();
            drawEnemies();
            checkCollisions();

            requestAnimationFrame(gameLoop);
        }

        restartGame();

    </script>

</body>
</html>
