
<!DOCTYPE html>
<html>
<head>
<title>t1a00-x-soccer-curling-Mio.html</title>

<style>
body {
    background: linear-gradient(135deg,#101030,#003344);
    color: white;
    font-family: Arial;
    text-align: center;
}

h1 { color: #00ffcc; }

canvas {
    width: 95%;
    max-width: 800px;
    background: #268c45;
    border: 3px solid white;
    border-radius: 10px;
    touch-action: none;
}

button {
    padding: 12px 25px;
    background: #00ffcc;
    border: 0;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    margin: 5px;
}
</style>
</head>

<body>

<h1>⚽ Mio Soccer Curling Shooter</h1>

<h3>
Score: <span id="score">0</span> |
Best: <span id="best">0</span> |
Level: <span id="level">1</span>/10
</h3>

<canvas id="game" width="800" height="450"></canvas>

<p id="message">Drag backwards from the ball to aim!</p>

<button onclick="startGame()">Start Game</button>
<button onclick="startGame()">Restart</button>

<p>Drag backwards to aim and curl the ball around obstacles!</p>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

let score = 0;
let level = 1;
let best = Number(localStorage.getItem("soccerBest")) || 0;
let playing = false;
let dragging = false;
let dx = 120;
let dy = 350;
let resetFrames = 0;

let ball = {
    x:120, y:350, vx:0, vy:0, spin:0
};

// Ten different obstacle layouts
function getObstacles() {
    const levels = [
        [],
        [{x:420,y:240,r:25}],
        [{x:350,y:270,r:25},{x:520,y:180,r:25}],
        [{x:300,y:180,r:25},{x:440,y:280,r:25},{x:570,y:190,r:25}],
        [{x:280,y:300,r:27},{x:390,y:160,r:27},{x:510,y:270,r:27}],
        [{x:300,y:220,r:28},{x:430,y:120,r:28},{x:540,y:330,r:28}],
        [{x:270,y:150,r:25},{x:390,y:300,r:25},{x:510,y:150,r:25},{x:620,y:300,r:25}],
        [{x:300,y:330,r:28},{x:390,y:210,r:28},{x:500,y:100,r:28},{x:600,y:260,r:28}],
        [{x:270,y:250,r:28},{x:370,y:120,r:28},{x:470,y:320,r:28},{x:570,y:170,r:28}],
        [{x:260,y:130,r:28},{x:350,y:300,r:28},{x:450,y:170,r:28},{x:550,y:320,r:28},{x:640,y:150,r:28}]
    ];

    return levels[level-1].map(o => ({...o}));
}

let obstacles = getObstacles();

document.getElementById("best").textContent = best;

// Draw game
function draw() {
    ctx.clearRect(0,0,800,450);

    ctx.fillStyle = "#268c45";
    ctx.fillRect(0,0,800,450);

    ctx.strokeStyle = "white";
    ctx.lineWidth = 3;
    ctx.strokeRect(20,20,760,410);

    ctx.beginPath();
    ctx.moveTo(400,20);
    ctx.lineTo(400,430);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(400,225,60,0,Math.PI*2);
    ctx.stroke();

    // Goal
    ctx.fillStyle = "#dddddd";
    ctx.fillRect(700,145,12,180);

    ctx.strokeStyle = "white";
    ctx.lineWidth = 5;
    ctx.strokeRect(685,145,100,180);

    ctx.lineWidth = 1;
    for(let y=160;y<325;y+=20) {
        ctx.beginPath();
        ctx.moveTo(700,y);
        ctx.lineTo(780,y);
        ctx.stroke();
    }

    // Obstacles
    obstacles.forEach(o => {
        ctx.fillStyle = "#222222";
        ctx.beginPath();
        ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
        ctx.fill();

        ctx.strokeStyle = "white";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = "red";
        ctx.font = "20px Arial";
        ctx.textAlign = "center";
        ctx.fillText("X",o.x,o.y+7);
    });

    ctx.textAlign = "left";

    // Predicted aiming line
    if(dragging) {
        let path = predict(getShot());

        ctx.strokeStyle = "yellow";
        ctx.lineWidth = 3;
        ctx.setLineDash([8,8]);
        ctx.beginPath();

        path.forEach((p,i) => {
            if(i===0) ctx.moveTo(p.x,p.y);
            else ctx.lineTo(p.x,p.y);
        });

        ctx.stroke();
        ctx.setLineDash([]);
    }

    // Soccer ball
    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(ball.x,ball.y,14,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle = "black";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = "black";
    ctx.beginPath();
    ctx.arc(ball.x,ball.y,5,0,Math.PI*2);
    ctx.arc(ball.x-7,ball.y-7,3,0,Math.PI*2);
    ctx.arc(ball.x+7,ball.y+7,3,0,Math.PI*2);
    ctx.fill();
}

// Calculate shot
function getShot() {
    return {
        vx:Math.max(3,Math.min(18,(ball.x-dx)*0.22)),
        vy:Math.max(-14,Math.min(14,(ball.y-dy)*0.22)),
        spin:Math.max(-0.12,Math.min(0.12,(dy-ball.y)*0.0015))
    };
}

// Move ball
function moveBall(b) {
    let ax = -b.vy*b.spin*0.08;
    let ay = b.vx*b.spin*0.08;

    b.vx += ax;
    b.vy += ay+0.12;

    let oldX = b.x;

    b.x += b.vx;
    b.y += b.vy;

    // Obstacle collisions
    obstacles.forEach(o => {
        let ox = b.x-o.x;
        let oy = b.y-o.y;
        let distance = Math.hypot(ox,oy);
        let minimum = o.r+14;

        if(distance<minimum) {
            let nx = ox/(distance||1);
            let ny = oy/(distance||1);

            b.x = o.x+nx*minimum;
            b.y = o.y+ny*minimum;

            let dot = b.vx*nx+b.vy*ny;

            if(dot<0) {
                b.vx -= 1.6*dot*nx;
                b.vy -= 1.6*dot*ny;
            }

            b.vx *= 0.65;
            b.vy *= 0.65;
        }
    });

    // Side walls
    if(b.y<34) {
        b.y=34;
        b.vy=Math.abs(b.vy)*0.7;
    }

    if(b.y>416) {
        b.y=416;
        b.vy=-Math.abs(b.vy)*0.7;
    }

    return oldX;
}

// Predict aiming line
function predict(shot) {
    let b = {
        x:ball.x, y:ball.y,
        vx:shot.vx, vy:shot.vy,
        spin:shot.spin
    };

    let path = [];

    for(let i=0;i<100;i++) {
        path.push({x:b.x,y:b.y});
        moveBall(b);

        if(b.x>=685 || b.x>790 || b.x<10) break;
    }

    return path;
}

// Start or restart game
function startGame() {
    score=0;
    level=1;
    playing=true;
    dragging=false;
    resetFrames=0;

    obstacles=getObstacles();
    resetBall();
    updateText();

    document.getElementById("message").textContent =
        "Level 1: Shoot into the open goal!";

    draw();
}

// Reset ball
function resetBall() {
    ball={
        x:120, y:350,
        vx:0, vy:0, spin:0
    };

    dragging=false;
}

// Update scoreboard
function updateText() {
    document.getElementById("score").textContent=score;
    document.getElementById("best").textContent=best;
    document.getElementById("level").textContent=level;
}

// Mouse and touch position
function position(e) {
    let r=c.getBoundingClientRect();

    return {
        x:(e.clientX-r.left)*800/r.width,
        y:(e.clientY-r.top)*450/r.height
    };
}

// Start aiming
c.addEventListener("pointerdown",e => {
    if(!playing || ball.vx!==0 || ball.vy!==0 || resetFrames>0) return;

    let p=position(e);

    if(Math.hypot(p.x-ball.x,p.y-ball.y)<35) {
        dragging=true;
        dx=p.x;
        dy=p.y;
        c.setPointerCapture(e.pointerId);
    }
});

// Move aiming line
c.addEventListener("pointermove",e => {
    if(!dragging) return;

    let p=position(e);
    dx=p.x;
    dy=p.y;
    draw();
});

// Shoot
c.addEventListener("pointerup",() => {
    if(!dragging) return;

    let shot=getShot();

    ball.vx=shot.vx;
    ball.vy=shot.vy;
    ball.spin=shot.spin;

    dragging=false;

    document.getElementById("message").textContent =
        "⚽ Curl it around the obstacles!";
});

// Game loop
function update() {
    if(playing) {
        if(resetFrames>0) {
            resetFrames--;

            if(resetFrames===0) {
                resetBall();
                document.getElementById("message").textContent =
                    "Level "+level+": Aim for the goal!";
            }
        }
        else if(ball.vx!==0 || ball.vy!==0) {
            let oldX=moveBall(ball);

            // Goal detection
            if(oldX<685 && ball.x>=685 &&
               ball.y>159 && ball.y<311) {

                score++;

                if(score>best) {
                    best=score;
                    localStorage.setItem("soccerBest",best);
                }

                // Finish after Level 10
                if(level===10) {
                    playing=false;
                    updateText();

                    document.getElementById("message").textContent =
                        "🏆 YOU BEAT ALL 10 LEVELS! Final score: "+score;
                }
                else {
                    level++;
                    obstacles=getObstacles();
                    updateText();

                    document.getElementById("message").textContent =
                        "🥅 GOAL! Welcome to Level "+level+"!";

                    ball.vx=0;
                    ball.vy=0;
                    resetFrames=60;
                }
            }

            // Missed goal
            else if(ball.x>790 || ball.x<10 ||
                    ball.y>440 || ball.y<10) {

                document.getElementById("message").textContent =
                    "Missed! Try curling around the obstacles!";

                ball.vx=0;
                ball.vy=0;
                resetFrames=60;
            }
        }
    }

    draw();
    requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
