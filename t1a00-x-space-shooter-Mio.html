
<!DOCTYPE html>
<html>
<head>
    <title>t1a00-x-space-shooter-Mio.html</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            background: #05051a;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            color: cyan;
            text-shadow: 0 0 15px cyan;
        }

        canvas {
            background: linear-gradient(#080825, #151540);
            border: 3px solid cyan;
            box-shadow: 0 0 20px cyan;
            display: block;
            margin: 15px auto;
            width: min(95%, 600px);
            height: auto;
        }

        button {
            background: cyan;
            color: black;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }

        button:hover {
            background: white;
            box-shadow: 0 0 15px cyan;
        }

        p {
            color: #00ffff;
        }

        .controls {
            margin: 12px;
        }
    </style>
</head>

<body>

    <h1>🚀 MIO SPACE SHOOTER 🚀</h1>

    <p>
        Score: <span id="score">0</span> |
        Lives: <span id="lives">3</span> |
        Level: <span id="level">1</span>
    </p>

    <canvas id="game" width="600" height="450"></canvas>

    <p>⬅️ ➡️ Move | SPACE Shoot</p>

    <div class="controls">
        <button id="left">⬅️ LEFT</button>
        <button id="shoot">🔥 SHOOT</button>
        <button id="right">RIGHT ➡️</button>
    </div>

    <button onclick="restartGame()">🔄 RESTART GAME</button>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        let player, bullets, enemies, stars;
        let score, lives, gameOver;
        let keys = {};
        let animationId;
        let shootCooldown = 0;
        let enemyTimer = 0;

        function restartGame() {
            cancelAnimationFrame(animationId);

            player = {
                x: 280,
                y: 390,
                width: 40,
                height: 35,
                speed: 6
            };

            bullets = [];
            enemies = [];
            stars = [];

            score = 0;
            lives = 3;
            gameOver = false;
            shootCooldown = 0;
            enemyTimer = 0;
            keys = {};

            for (let i = 0; i < 80; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    speed: Math.random() * 2 + 1
                });
            }

            updateScore();
            updateLives();

            document.getElementById("level").innerText = 1;

            gameLoop();
        }

        function updateScore() {
            document.getElementById("score").innerText = score;
            document.getElementById("level").innerText =
                Math.floor(score / 100) + 1;
        }

        function updateLives() {
            document.getElementById("lives").innerText = lives;
        }

        document.addEventListener("keydown", function(e) {
            keys[e.code] = true;

            if (["Space", "ArrowLeft", "ArrowRight"].includes(e.code)) {
                e.preventDefault();
            }
        });

        document.addEventListener("keyup", function(e) {
            keys[e.code] = false;
        });

        function setupButton(id, key) {
            const button = document.getElementById(id);

            button.addEventListener("pointerdown", function(e) {
                e.preventDefault();
                keys[key] = true;
            });

            button.addEventListener("pointerup", function() {
                keys[key] = false;
            });

            button.addEventListener("pointerleave", function() {
                keys[key] = false;
            });

            button.addEventListener("pointercancel", function() {
                keys[key] = false;
            });
        }

        setupButton("left", "ArrowLeft");
        setupButton("right", "ArrowRight");
        setupButton("shoot", "Space");

        function drawPlayer() {
            ctx.save();

            ctx.fillStyle = "#00ffff";
            ctx.shadowColor = "cyan";
            ctx.shadowBlur = 15;

            ctx.beginPath();
            ctx.moveTo(player.x + 20, player.y);
            ctx.lineTo(player.x, player.y + 35);
            ctx.lineTo(player.x + 40, player.y + 35);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "white";
            ctx.fillRect(player.x + 16, player.y + 19, 8, 10);

            ctx.restore();
        }

        function drawStars() {
            ctx.fillStyle = "white";

            stars.forEach(star => {
                ctx.fillRect(star.x, star.y, 2, 2);

                star.y += star.speed;

                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });
        }

        function shoot() {
            bullets.push({
                x: player.x + 18,
                y: player.y,
                speed: 8
            });
        }

        function drawBullets() {
            ctx.save();

            ctx.fillStyle = "yellow";
            ctx.shadowColor = "yellow";
            ctx.shadowBlur = 10;

            bullets.forEach(bullet => {
                ctx.fillRect(bullet.x, bullet.y, 5, 12);
                bullet.y -= bullet.speed;
            });

            ctx.restore();

            bullets = bullets.filter(b => b.y > 0);
        }

        function spawnEnemy() {
            enemies.push({
                x: Math.random() * (canvas.width - 30),
                y: -30,
                size: 30,
                speed: 2 + Math.random() * 2 +
                    Math.floor(score / 100) * 0.3
            });
        }

        function drawEnemies() {
            ctx.save();

            ctx.fillStyle = "#ff3366";
            ctx.shadowColor = "red";
            ctx.shadowBlur = 12;

            enemies.forEach(enemy => {
                ctx.fillRect(
                    enemy.x,
                    enemy.y,
                    enemy.size,
                    enemy.size
                );

                ctx.fillStyle = "white";
                ctx.fillRect(enemy.x + 6, enemy.y + 8, 5, 5);
                ctx.fillRect(enemy.x + 19, enemy.y + 8, 5, 5);

                ctx.fillStyle = "#ff3366";

                enemy.y += enemy.speed;
            });

            ctx.restore();
        }

        function checkCollisions() {
            // Bullet hits enemy
            for (let bi = bullets.length - 1; bi >= 0; bi--) {
                for (let ei = enemies.length - 1; ei >= 0; ei--) {

                    let b = bullets[bi];
                    let e = enemies[ei];

                    if (
                        b.x < e.x + e.size &&
                        b.x + 5 > e.x &&
                        b.y < e.y + e.size &&
                        b.y + 12 > e.y
                    ) {
                        bullets.splice(bi, 1);
                        enemies.splice(ei, 1);

                        score += 10;
                        updateScore();
                        break;
                    }
                }
            }

            // Enemy hits player or escapes
            for (let i = enemies.length - 1; i >= 0; i--) {
                let enemy = enemies[i];

                if (
                    enemy.y + enemy.size > player.y &&
                    enemy.y < player.y + player.height &&
                    enemy.x < player.x + player.width &&
                    enemy.x + enemy.size > player.x
                ) {
                    enemies.splice(i, 1);
                    lives--;
                    updateLives();

                    if (lives <= 0) {
                        gameOver = true;
                    }
                } else if (enemy.y > canvas.height) {
                    enemies.splice(i, 1);
                }
            }
        }

        function gameLoop() {
            if (gameOver) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                drawStars();

                ctx.fillStyle = "white";
                ctx.textAlign = "center";
                ctx.font = "40px Arial";
                ctx.fillText("GAME OVER!", 300, 200);

                ctx.font = "24px Arial";
                ctx.fillText("Final Score: " + score, 300, 245);

                ctx.font = "17px Arial";
                ctx.fillText("Press RESTART to play again", 300, 285);

                animationId = null;
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawStars();

            if (keys["ArrowLeft"]) {
                player.x -= player.speed;
            }

            if (keys["ArrowRight"]) {
                player.x += player.speed;
            }

            player.x = Math.max(
                0,
                Math.min(canvas.width - player.width, player.x)
            );

            if (keys["Space"] && shootCooldown <= 0) {
                shoot();
                shootCooldown = 12;
            }

            if (shootCooldown > 0) {
                shootCooldown--;
            }

            enemyTimer++;

            let spawnRate = Math.max(18, 45 - Math.floor(score / 100) * 3);

            if (enemyTimer > spawnRate) {
                spawnEnemy();
                enemyTimer = 0;
            }

            drawPlayer();
            drawBullets();
            drawEnemies();
            checkCollisions();

            animationId = requestAnimationFrame(gameLoop);
        }

        restartGame();

    </script>

</body>
</html>
