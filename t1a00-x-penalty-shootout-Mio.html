
<!DOCTYPE html>
<html>
<head>
    <title>Penalty Shootout - Mio</title>

    <style>
        body {
            background: linear-gradient(135deg, #080820, #003344);
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #00ffcc;
            text-shadow: 0 0 15px cyan;
        }

        .game {
            max-width: 600px;
            margin: auto;
            background: #151535;
            padding: 20px;
            border: 2px solid cyan;
            border-radius: 20px;
            box-shadow: 0 0 20px cyan;
        }

        .goal {
            background: #176b42;
            border: 8px solid white;
            border-bottom: 12px solid white;
            height: 210px;
            margin: 20px auto;
            max-width: 420px;
            position: relative;
            overflow: hidden;
            background-image:
                linear-gradient(#ffffff30 1px, transparent 1px),
                linear-gradient(90deg, #ffffff30 1px, transparent 1px);
            background-size: 35px 35px;
        }

        #keeper {
            font-size: 55px;
            position: absolute;
            top: 95px;
            left: 50%;
            transform: translateX(-50%);
            transition: all .3s;
        }

        #ball {
            font-size: 35px;
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            transition: all .5s;
        }

        button {
            background: #00ffcc;
            color: #001b22;
            border: none;
            padding: 12px 20px;
            margin: 6px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: yellow;
            transform: scale(1.08);
        }

        button:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        #message {
            color: #00ffcc;
            font-size: 22px;
            min-height: 30px;
        }

        .stats {
            color: yellow;
            font-size: 19px;
        }
    </style>
</head>

<body>

<h1>⚽ PENALTY SHOOTOUT</h1>
<h3>🔥 MIO FOOTBALL CHALLENGE 🔥</h3>

<div class="game">

    <div class="stats">
        Goals: <span id="score">0</span> |
        Shots: <span id="shots">0</span>/5
    </div>

    <div class="goal">
        <div id="keeper">🧤</div>
        <div id="ball">⚽</div>
    </div>

    <h3>Choose your shooting direction!</h3>

    <button onclick="choose('left')">⬅ LEFT</button>
    <button onclick="choose('center')">⬆ CENTER</button>
    <button onclick="choose('right')">RIGHT ➡</button>

    <p id="aim">Aim: CENTER</p>

    <button id="shoot" onclick="shoot()">⚽ SHOOT!</button>

    <p id="message">Ready to take your first shot?</p>

    <h2 id="result"></h2>

    <button onclick="restart()">🔄 PLAY AGAIN</button>

</div>

<script>
    let score = 0;
    let shots = 0;
    let direction = "center";
    let playing = true;

    const positions = {
        left: "20%",
        center: "50%",
        right: "80%"
    };

    function choose(dir) {
        if (!playing) return;

        direction = dir;
        document.getElementById("aim").innerText =
            "Aim: " + dir.toUpperCase();
    }

    function shoot() {
        if (!playing || shots >= 5) return;

        shots++;

        let keeperChoice =
            ["left", "center", "right"]
            [Math.floor(Math.random() * 3)];

        let keeper = document.getElementById("keeper");
        let ball = document.getElementById("ball");

        keeper.style.left = positions[keeperChoice];

        ball.style.left = positions[direction];
        ball.style.bottom = "130px";

        if (direction === keeperChoice) {
            document.getElementById("message").innerText =
                "🧤 SAVED! The goalkeeper got it!";
        } else {
            score++;
            document.getElementById("message").innerText =
                "🔥 GOOOOAL! Amazing shot!";
        }

        document.getElementById("score").innerText = score;
        document.getElementById("shots").innerText = shots;

        document.getElementById("shoot").disabled = true;

        setTimeout(() => {
            ball.style.left = "50%";
            ball.style.bottom = "5px";

            if (shots === 5) {
                playing = false;

                document.getElementById("result").innerText =
                    "🏆 FINAL SCORE: " + score + "/5";

                document.getElementById("message").innerText =
                    score >= 3 ? "CHAMPION! 🥇" : "GOOD TRY! ⚽";
            } else {
                document.getElementById("shoot").disabled = false;
            }
        }, 900);
    }

    function restart() {
        score = 0;
        shots = 0;
        direction = "center";
        playing = true;

        document.getElementById("score").innerText = 0;
        document.getElementById("shots").innerText = 0;
        document.getElementById("aim").innerText = "Aim: CENTER";
        document.getElementById("message").innerText =
            "Ready to take your first shot?";
        document.getElementById("result").innerText = "";

        document.getElementById("keeper").style.left = "50%";

        let ball = document.getElementById("ball");
        ball.style.left = "50%";
        ball.style.bottom = "5px";

        document.getElementById("shoot").disabled = false;
    }
</script>

</body>
</html>
