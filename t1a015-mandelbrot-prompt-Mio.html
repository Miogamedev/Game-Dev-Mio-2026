
<!DOCTYPE html>
<html>
<head>
    <title>t1a015-Mandelbrot-prompt-Mio.html</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: black;
            color: white;
            font-family: Arial;
            overflow: hidden;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #myCanvas {
            z-index: 1;
        }

        #myOverlay {
            z-index: 2;
            pointer-events: none;
        }

        h2 {
            position: fixed;
            top: 5px;
            width: 100%;
            text-align: center;
            color: cyan;
            text-shadow: 0 0 15px blue;
            pointer-events: none;
            z-index: 3;
            font-size: 24px;
        }

        #myZoom {
            position: fixed;
            top: 55px;
            left: 15px;
            color: magenta;
            text-shadow: 0 0 10px magenta;
            z-index: 4;
            font-weight: bold;
        }

        #myHint {
            position: fixed;
            top: 85px;
            left: 15px;
            z-index: 5;
        }

        #myButtons {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 4;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            width: 95%;
        }

        button {
            padding: 10px 14px;
            margin: 3px;
            background: #101030;
            color: cyan;
            border: 1px solid cyan;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #004455;
            box-shadow: 0 0 12px cyan;
        }

        #myModal {
            display: none;
            position: fixed;
            z-index: 10;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            max-width: 450px;
            padding: 20px;
            text-align: center;
            background: #101030;
            border: 2px solid cyan;
            border-radius: 15px;
            box-shadow: 0 0 25px cyan;
        }

        #myModal h3 {
            color: cyan;
        }

        @media (max-width: 500px) {
            h2 {
                font-size: 19px;
            }

            #myButtons {
                bottom: 8px;
            }

            button {
                padding: 9px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<h2>🌌 Mandelbrot Fractal by Mio 🌌</h2>

<div id="myZoom">Zoom: 1x</div>

<button id="myHint" onclick="myInfo()">💡 Info</button>

<div id="myModal">
    <h3>🌌 About the Fractal</h3>

    <p>Made using Z(n+1) = Z(n)² + C.</p>

    <p>Move your mouse to preview the zoom area.</p>

    <p>Click or tap the screen to zoom in.</p>

    <p>Use the buttons to control the fractal.</p>

    <button onclick="myInfo()">Close</button>
</div>

<div id="myButtons">
    <button onclick="myZoomIn()">🔍 Zoom In</button>
    <button onclick="myZoomOut()">🔎 Zoom Out</button>
    <button onclick="myChangeColor()">🎨 Colors</button>
    <button onclick="myReset()">🔄 Reset</button>
</div>

<canvas id="myCanvas"></canvas>
<canvas id="myOverlay"></canvas>

<script>

const myCanvas = document.getElementById("myCanvas");
const myCtx = myCanvas.getContext("2d");

const myOverlay = document.getElementById("myOverlay");
const myOverlayCtx = myOverlay.getContext("2d");

let myX = -0.5;
let myY = 0;
let mySize = 3.5;
let myPreview = 0.25;

let myMouseX = 0;
let myMouseY = 0;
let myInside = false;

let myToken = 0;
let myScale = 1;

let myColor = 0;

// Resize the canvas
function myResize() {

    myScale = Math.min(1, 900 / window.innerWidth);

    myCanvas.width = Math.max(
        1,
        Math.floor(window.innerWidth * myScale)
    );

    myCanvas.height = Math.max(
        1,
        Math.floor(window.innerHeight * myScale)
    );

    myOverlay.width = myCanvas.width;
    myOverlay.height = myCanvas.height;

    myDraw();
}

// Color generator
function myGetColor(n) {

    let c = n * 0.12;

    if (myColor === 0) {
        return [
            128 + 127 * Math.sin(c),
            128 + 127 * Math.sin(c + 2),
            128 + 127 * Math.sin(c + 4)
        ];
    }

    if (myColor === 1) {
        return [
            128 + 127 * Math.sin(c + 4),
            128 + 127 * Math.sin(c),
            128 + 127 * Math.sin(c + 2)
        ];
    }

    return [
        128 + 127 * Math.sin(c),
        128 + 127 * Math.sin(c + 3),
        128 + 127 * Math.sin(c + 5)
    ];
}

// Draw the Mandelbrot fractal
async function myDraw() {

    let myID = ++myToken;

    let w = myCanvas.width;
    let h = myCanvas.height;

    let img = myCtx.createImageData(w, h);
    let d = img.data;

    let max = 120;

    let height = mySize * h / w;

    for (let y = 0; y < h; y++) {

        if (myID !== myToken) return;

        for (let x = 0; x < w; x++) {

            let a = myX + (x / w - 0.5) * mySize;
            let b = myY + (y / h - 0.5) * height;

            let r = 0;
            let i = 0;
            let n = 0;

            while (
                r * r + i * i < 256 &&
                n < max
            ) {

                let t = r * r - i * i + a;

                i = 2 * r * i + b;
                r = t;

                n++;
            }

            let k = (y * w + x) * 4;

            if (n === max) {

                d[k] = 0;
                d[k + 1] = 0;
                d[k + 2] = 0;

            } else {

                let color = myGetColor(n);

                d[k] = color[0];
                d[k + 1] = color[1];
                d[k + 2] = color[2];

            }

            d[k + 3] = 255;
        }

        // Allow the browser to update
        if (y % 8 === 0) {
            await new Promise(resolve =>
                setTimeout(resolve, 0)
            );
        }
    }

    if (myID !== myToken) return;

    myCtx.putImageData(img, 0, 0);

    document.getElementById("myZoom").innerText =
        "Zoom: " + (3.5 / mySize).toFixed(2) + "x";

    myDrawPreview();
}

// Draw the zoom preview box
function myDrawPreview() {

    myOverlayCtx.clearRect(
        0,
        0,
        myOverlay.width,
        myOverlay.height
    );

    if (!myInside) return;

    let w = myOverlay.width * myPreview;
    let h = myOverlay.height * myPreview;

    let x = Math.max(
        0,
        Math.min(
            myOverlay.width - w,
            myMouseX - w / 2
        )
    );

    let y = Math.max(
        0,
        Math.min(
            myOverlay.height - h,
            myMouseY - h / 2
        )
    );

    myOverlayCtx.save();

    myOverlayCtx.setLineDash([8, 6]);

    myOverlayCtx.strokeStyle = "cyan";
    myOverlayCtx.lineWidth = 3;

    myOverlayCtx.shadowBlur = 12;
    myOverlayCtx.shadowColor = "cyan";

    myOverlayCtx.strokeRect(x, y, w, h);

    myOverlayCtx.restore();
}

// Update mouse or touch position
function myUpdatePointer(e) {

    let rect = myCanvas.getBoundingClientRect();

    myMouseX =
        (e.clientX - rect.left) *
        (myCanvas.width / rect.width);

    myMouseY =
        (e.clientY - rect.top) *
        (myCanvas.height / rect.height);

    myInside = true;

    myDrawPreview();
}

// Mouse and touch movement
myCanvas.addEventListener("pointermove", function(e) {

    myUpdatePointer(e);

});

myCanvas.addEventListener("pointerleave", function() {

    myInside = false;
    myDrawPreview();

});

// Click or tap to zoom
myCanvas.addEventListener("pointerdown", function(e) {

    if (e.button !== 0 && e.pointerType === "mouse") {
        return;
    }

    myUpdatePointer(e);
    myZoomAtPointer();

});

// Zoom into preview area
function myZoomAtPointer() {

    let w = myCanvas.width * myPreview;
    let h = myCanvas.height * myPreview;

    let x = Math.max(
        0,
        Math.min(
            myCanvas.width - w,
            myMouseX - w / 2
        )
    );

    let y = Math.max(
        0,
        Math.min(
            myCanvas.height - h,
            myMouseY - h / 2
        )
    );

    myX += (
        (x + w / 2) / myCanvas.width - 0.5
    ) * mySize;

    myY += (
        (y + h / 2) / myCanvas.height - 0.5
    ) * mySize *
    myCanvas.height / myCanvas.width;

    mySize *= myPreview;

    myInside = false;

    myDraw();
}

// Scroll to change preview size
myCanvas.addEventListener("wheel", function(e) {

    e.preventDefault();

    myPreview = Math.max(
        0.05,
        Math.min(
            0.8,
            myPreview * (e.deltaY < 0 ? 0.85 : 1.18)
        )
    );

    myDrawPreview();

}, { passive: false });

// Zoom buttons
function myZoomIn() {

    mySize = Math.max(0.0000000001, mySize * 0.5);

    myDraw();

}

function myZoomOut() {

    mySize = Math.min(20, mySize * 2);

    myDraw();

}

// Change colors
function myChangeColor() {

    myColor = (myColor + 1) % 3;

    myDraw();

}

// Reset everything
function myReset() {

    myX = -0.5;
    myY = 0;

    mySize = 3.5;
    myPreview = 0.25;
    myColor = 0;

    myInside = false;

    myDraw();

}

// Information popup
function myInfo() {

    let box = document.getElementById("myModal");

    box.style.display =
        box.style.display === "block" ? "none" : "block";

}

// Resize event
window.addEventListener("resize", myResize);

// Start the fractal!
myResize();

</script>

</body>
</html>
