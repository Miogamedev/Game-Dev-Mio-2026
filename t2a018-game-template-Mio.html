
<!DOCTYPE html>
<html>
<head>
    <title>t2a018-game-template-Mio.html</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: lightblue;
        }

        #myCanvas {
            background-color: white;
            border: 2px solid black;
        }
    </style>
</head>

<body>

    <h1>t2a018-game-template-Mio.html</h1>
    <h2>Game Template</h2>

    <p>Score: <span id="myScore">0</span></p>

    <canvas id="myCanvas" width="700" height="450"></canvas>

    <p>
        <button onclick="startGame()">Start Template</button>
    </p>

    <script>
        // Get the canvas
        let myCanvas = document.getElementById('myCanvas');
        let myContext = myCanvas.getContext('2d');

        // Game variables
        let myScore = 0;

        // Draw the canvas
        function drawGame() {
            myContext.clearRect(0, 0, myCanvas.width, myCanvas.height);

            myContext.font = "25px Arial";
            myContext.fillStyle = "black";
            myContext.fillText("My Game Template", 250, 200);

            document.getElementById('myScore').innerHTML = myScore;
        }

        // Start the template
        function startGame() {
            myScore = 0;
            drawGame();
        }

        // Draw starting screen
        drawGame();
    </script>

</body>
</html>
