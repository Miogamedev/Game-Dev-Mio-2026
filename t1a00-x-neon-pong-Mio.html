
<!DOCTYPE html>
<html>

<head>
    <title>t1a00-x-neon-pong-Mio.html</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            padding: 15px;
            background: linear-gradient(135deg, #080820, #002b40);
            color: white;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            color: cyan;
            text-shadow: 0 0 15px cyan, 0 0 30px blue;
        }

        .score {
            font-size: 32px;
            color: cyan;
            text-shadow: 0 0 12px cyan;
            margin: 15px;
        }

        canvas {
            display: block;
            width: 100%;
            max-width: 800px;
            height: auto;
            margin: 15px auto;
            background: #050515;
            border: 3px solid cyan;
            border-radius: 12px;
            box-shadow: 0 0 20px cyan;
        }

        button {
            background: cyan;
            color: #001020;
            border: none;
            padding: 12px 20px;
            margin: 6px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 12px cyan;
            touch-action: none;
        }

        button:hover {
            background: white;
            box-shadow: 0 0 20px cyan;
        }

        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin: 15px;
        }

        .player-controls {
            border: 1px solid cyan;
            border-radius: 12px;
            padding: 10px;
            min-width: 220px;
        }

        p {
            color: #aafaff;
        }
    </style>
</head>

<body>

    <h1>🏓 NEON PONG 🏓</h1>
    <p>⚡ MIO GAME DEV 2026 ⚡</p>

    <div class="score">
        <span id="score1">0</span>
        :
        <span id="score2">0</span>
    </div>

    <canvas id="game" width="800" height="450"></canvas>

    <p>First player to 5 points wins!</p>
    <p>Player 1: W / S | Player 2: UP / DOWN</p>

    <div class="controls">

        <div class="player-controls">
            <h3 style="color:cyan;">🔵 PLAYER 1</h3>
            <button id="p1up">⬆ UP</button>
            <button id="p1down">⬇ DOWN</button>
        </div>

        <div class="player-controls">
            <h3 style="color:#ff55ff;">🟣 PLAYER 2</h3>
            <button id="p2up">⬆ UP</button>
            <button id="p2down">⬇ DOWN</button>
        </div>

    </div>

    <button onclick="restartGame()">🔄 RESTART GAME</button>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        const W = canvas.width;
        const H = canvas.height;
        const WIN_SCORE = 5;

        let player1, player2, ball;
        let score1, score2;
        let keys = {};
        let gameOver = false;
        let winner = "";
        let animationId;
        let serveTimer = 0;

        function restartGame() {
            cancelAnimationFrame(animationId);

            player1 = {
                x: 25, y: 175,
                width: 15, height: 100,
                speed: 7
            };

            player2 = {
                x: 760, y: 175,
                width: 15, height: 100,
                speed: 7
            };

            ball = {
                x: 400, y: 225,
                size: 14,
                speedX: 5,
                speedY: 3
            };

            score1 = 0;
            score2 = 0;
            gameOver = false;
            winner = "";
            serveTimer = 50;
            keys = {};

            updateScore();
            gameLoop();
        }

        function updateScore() {
            document.getElementById("score1").textContent = score1;
            document.getElementById("score2").textContent = score2;
        }

        function resetBall(direction) {
            ball.x = W / 2;
            ball.y = H / 2;
            ball.speedX = 5 * direction;
            ball.speedY = Math.random() * 4 - 2;
            serveTimer = 50;
        }

        document.addEventListener("keydown", e => {
            keys[e.code] = true;

            if (["ArrowUp", "ArrowDown", "Space"].includes(e.code)) {
                e.preventDefault();
            }
        });

        document.addEventListener("keyup", e => {
            keys[e.code] = false;
        });

        window.addEventListener("blur", () => {
            keys = {};
        });

        function setupButton(id, key) {
            const button = document.getElementById(id);

            button.addEventListener("pointerdown", e => {
                e.preventDefault();
                keys[key] = true;
                button.setPointerCapture(e.pointerId);
            });

            function release() {
                keys[key] = false;
            }

            button.addEventListener("pointerup", release);
            button.addEventListener("pointercancel", release);
            button.addEventListener("lostpointercapture", release);
        }

        setupButton("p1up", "KeyW");
        setupButton("p1down", "KeyS");
        setupButton("p2up", "ArrowUp");
        setupButton("p2down", "ArrowDown");

        function drawBackground() {
            ctx.fillStyle = "#050515";
            ctx.fillRect(0, 0, W, H);

            ctx.save();
            ctx.strokeStyle = "#164466";
            ctx.lineWidth = 4;
            ctx.setLineDash([12, 12]);

            ctx.beginPath();
            ctx.moveTo(W / 2, 0);
            ctx.lineTo(W / 2, H);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(400, 225, 65, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();
        }

        function drawPaddles() {
            ctx.save();
            ctx.shadowBlur = 20;

            ctx.shadowColor = "cyan";
            ctx.fillStyle = "cyan";
            ctx.fillRect(
                player1.x, player1.y,
                player1.width, player1.height
            );

            ctx.shadowColor = "#ff33ff";
            ctx.fillStyle = "#ff33ff";
            ctx.fillRect(
                player2.x, player2.y,
                player2.width, player2.height
            );

            ctx.restore();
        }

        function drawBall() {
            ctx.save();
            ctx.shadowColor = "white";
            ctx.shadowBlur = 25;
            ctx.fillStyle = "white";

            ctx.beginPath();
            ctx.arc(
                ball.x, ball.y,
                ball.size / 2, 0, Math.PI * 2
            );
            ctx.fill();

            ctx.restore();
        }

        function movePlayers() {
            if (keys["KeyW"]) player1.y -= player1.speed;
            if (keys["KeyS"]) player1.y += player1.speed;

            if (keys["ArrowUp"]) player2.y -= player2.speed;
            if (keys["ArrowDown"]) player2.y += player2.speed;

            player1.y = Math.max(
                0, Math.min(H - player1.height, player1.y)
            );

            player2.y = Math.max(
                0, Math.min(H - player2.height, player2.y)
            );
        }

        function moveBall() {
            if (serveTimer > 0) {
                serveTimer--;
                return;
            }

            ball.x += ball.speedX;
            ball.y += ball.speedY;

            // Bounce off top and bottom
            if (
                ball.y - ball.size / 2 <= 0 ||
                ball.y + ball.size / 2 >= H
            ) {
                ball.speedY *= -1;
            }

            // Player 1 collision
            if (
                ball.speedX < 0 &&
                ball.x - ball.size / 2 <= player1.x + player1.width &&
                ball.x + ball.size / 2 >= player1.x &&
                ball.y >= player1.y &&
                ball.y <= player1.y + player1.height
            ) {
                ball.speedX = Math.abs(ball.speedX) * 1.05;

                let hit =
                    (ball.y - (player1.y + player1.height / 2)) /
                    (player1.height / 2);

                ball.speedY = hit * 6;
                ball.x = player1.x + player1.width + ball.size / 2;
            }

            // Player 2 collision
            if (
                ball.speedX > 0 &&
                ball.x + ball.size / 2 >= player2.x &&
                ball.x - ball.size / 2 <= player2.x + player2.width &&
                ball.y >= player2.y &&
                ball.y <= player2.y + player2.height
            ) {
                ball.speedX = -Math.abs(ball.speedX) * 1.05;

                let hit =
                    (ball.y - (player2.y + player2.height / 2)) /
                    (player2.height / 2);

                ball.speedY = hit * 6;
                ball.x = player2.x - ball.size / 2;
            }

            // Player 2 scores
            if (ball.x < 0) {
                score2++;
                updateScore();

                if (score2 >= WIN_SCORE) {
                    endGame("PLAYER 2");
                } else {
                    resetBall(-1);
                }
            }

            // Player 1 scores
            if (ball.x > W) {
                score1++;
                updateScore();

                if (score1 >= WIN_SCORE) {
                    endGame("PLAYER 1");
                } else {
                    resetBall(1);
                }
            }
        }

        function endGame(name) {
            gameOver = true;
            winner = name;
        }

        function drawGameOver() {
            ctx.fillStyle = "rgba(0,0,20,0.85)";
            ctx.fillRect(0, 0, W, H);

            ctx.textAlign = "center";
            ctx.shadowColor = "cyan";
            ctx.shadowBlur = 20;
            ctx.fillStyle = "cyan";
            ctx.font = "bold 45px Arial";
            ctx.fillText(winner + " WINS!", 400, 200);

            ctx.shadowBlur = 0;
            ctx.fillStyle = "white";
            ctx.font = "24px Arial";
            ctx.fillText(score1 + " : " + score2, 400, 250);

            ctx.font = "18px Arial";
            ctx.fillText(
                "Press RESTART to play again!",
                400, 300
            );
        }

        function gameLoop() {
            drawBackground();

            if (!gameOver) {
                movePlayers();
                moveBall();
            }

            drawPaddles();
            drawBall();

            if (gameOver) {
                drawGameOver();
                animationId = null;
                return;
            }

            animationId = requestAnimationFrame(gameLoop);
        }

        restartGame();

    </script>

</body>
</html>
