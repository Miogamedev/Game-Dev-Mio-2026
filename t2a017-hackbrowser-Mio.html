
<!DOCTYPE html>
<html>
<head>
    <title>t2a017-hackbrowser-Mio.html</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .box {
            border: 1px solid black;
            padding: 15px;
            margin: 15px auto;
            max-width: 700px;
        }

        table {
            margin: auto;
            border-collapse: collapse;
        }

        td, th {
            border: 1px solid black;
            padding: 10px;
        }

        img {
            width: 250px;
        }

        #result {
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

<h1>t2a017-hackbrowser by Mio</h1>

<p>Explore the HTML behind a webpage!</p>

<div class="box">

    <h2>My HTML Elements</h2>

    <!-- 1. Link -->
    <a id="myLink" name="myLink"
       href="https://www.google.com" target="_blank">
       Visit Google
    </a>

    <br><br>

    <!-- 2. Table -->
    <table id="myTable" name="myTable">
        <tr>
            <th>Game</th>
            <th>Type</th>
        </tr>
        <tr>
            <td>Basketball</td>
            <td>Sports</td>
        </tr>
    </table>

    <br>

    <!-- 3. List -->
    <ul id="myList" name="myList">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <!-- 4. Bold -->
    <p>
        This is <b id="myBold" name="myBold">important bold text</b>.
    </p>

    <!-- 5. Button -->
    <button id="myButton" name="myButton"
        onclick="alert('Hello from Mio!')">
        Click Me
    </button>

</div>

<div class="box">

    <h2>My Image</h2>

    <img id="myImage" name="myImage"
         src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=600"
         alt="Night sky">

</div>

<div class="box">

    <h2>HTML Inspector</h2>

    <p>Click buttons 14–18 to inspect the HTML elements.</p>

    <button onclick="inspectElement('myLink')">
        14. Inspect Link
    </button>

    <button onclick="inspectElement('myTable')">
        15. Inspect Table
    </button>

    <button onclick="inspectElement('myList')">
        16. Inspect List
    </button>

    <button onclick="inspectElement('myBold')">
        17. Inspect Bold
    </button>

    <button onclick="inspectElement('myButton')">
        18. Inspect Button
    </button>

    <p id="result">HTML information appears here.</p>

</div>

<script>

function inspectElement(myId) {

    let myElement = document.getElementById(myId);

    let myInfo = "";

    myInfo += "ID: " + myElement.id + "<br>";
    myInfo += "Name: " + myElement.getAttribute("name") + "<br>";
    myInfo += "Tag: " + myElement.tagName + "<br>";
    myInfo += "HTML: " + myElement.outerHTML;

    document.getElementById("result").innerHTML = myInfo;
}

</script>

</body>
</html>
