```html
<!DOCTYPE html>
<html>
<head>
    <title>t2a018-game-template-Mio.html</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: lightblue;
        }

        #myCanvas {
            background-color: white;
            border: 2px solid black;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>t2a018-game-template-Mio.html</h1>
    <h2>Game Template</h2>

    <p>Score: <span id="myScore">0</span></p>

    <canvas id="myCanvas" width="700" height="450"></canvas>

    <p>
        <button onclick="startGame()">Start Template</button>
    </p>

    <p>Use the arrow keys to move!</p>

    <script>
        // Get the canvas
        let myCanvas = document.getElementById('myCanvas');
        let myContext = myCanvas.getContext('2d');

        // Background image
        let myImage = new Image();
        myImage.src = "https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?w=1000";

        // Game variables
        let myScore = 0;
        let myX = 325;
        let myY = 200;
        let mySpeed = 5;
        let myGameRunning = false;

        // Draw the game
        function drawGame() {
            myContext.clearRect(0, 0, myCanvas.width, myCanvas.height);

            // Draw background image
            myContext.drawImage(myImage, 0, 0, 700, 450);

            // Draw player
            myContext.font = "40px Arial";
            myContext.fillText("🚀", myX, myY);

            // Show score
            document.getElementById('myScore').innerHTML = myScore;
        }

        // Start the game
        function startGame() {
            myScore = 0;
            myX = 325;
            myY = 200;
            myGameRunning = true;
            drawGame();
        }

        // Move with arrow keys
        document.addEventListener('keydown', function(event) {

            if (!myGameRunning) return;

            if (event.key === "ArrowUp") {
                myY -= mySpeed;
            }

            if (event.key === "ArrowDown") {
                myY += mySpeed;
            }

            if (event.key === "ArrowLeft") {
                myX -= mySpeed;
            }

            if (event.key === "ArrowRight") {
                myX += mySpeed;
            }

            // Keep player inside canvas
            myX = Math.max(40, Math.min(660, myX));
            myY = Math.max(40, Math.min(440, myY));

            myScore++;
            drawGame();
        });

        // Draw starting screen
        myImage.onload = function() {
            drawGame();
        };

    </script>

</body>
</html>
```
