    <textarea id="myArea03" rows="4" cols="50"></textarea>

    <script>

        function encrypt() {
            let myString = document.getElementById('myArea01').value.toLowerCase();
            let myTemp = '';

            for (let i = 0; i < myString.length; i++) {
                if (myString[i] == 'e') {
                    myTemp += 'f';
                } else if (myString[i] == 'h') {
                    myTemp += 'i';
                } else {
                    myTemp += myString[i];
                }
            }

            document.getElementById('myArea02').value = myTemp;
            document.getElementById('myArea03').value = '';
        }

        function decrypt() {
            let myString = document.getElementById('myArea02').value;
            let myTemp = '';

            for (let i = 0; i < myString.length; i++) {
                if (myString[i] == 'f') {
                    myTemp += 'e';
                } else if (myString[i] == 'i') {
                    myTemp += 'h';
                } else {
                    myTemp += myString[i];
                }
            }

            document.getElementById('myArea03').value = myTemp;
        }

    </script>
