<!DOCTYPE html>
<html>
<head>
    <title>t2a018-game-template-Mio.html</title>

    <style>
        body {
            background: linear-gradient(135deg, #101030, #003344);
            color: white;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            color: #00ffcc;
            text-shadow: 0 0 15px cyan;
        }

        #myCanvas {
            background-image: url("space-background.png");
            background-size: cover;
            background-position: center;
            border: 3px solid cyan;
            box-shadow: 0 0 15px cyan;
        }

        button {
            background: cyan;
            color: black;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #66ffff;
        }
    </style>
</head>

<body>

    <h1>🚀 Mio's Space Adventure</h1>
    <h2>Game Template</h2>

    <p>Score: <span id="myScore">0</span></p>

    <canvas id="myCanvas" width="700" height="450"></canvas>

    <p>
        <button onclick="startGame()">Start Template</button>
    </p>

    <p>Use the arrow keys to move your spaceship.</p>

    <script>
        // Get the canvas
        let myCanvas = document.getElementById('myCanvas');
        let myContext = myCanvas.getContext('2d');

        // Game variables
        let myPlayerX = 325;
        let myPlayerY = 350;
        let myScore = 0;
        let myGameRunning = false;

        // Draw the player
        function drawGame() {
            myContext.clearRect(0, 0, myCanvas.width, myCanvas.height);

            // Player spaceship
            myContext.font = "40px Arial";
            myContext.fillText("🚀", myPlayerX, myPlayerY);

            // Display score
            document.getElementById('myScore').innerHTML = myScore;
        }

        // Start the template
        function startGame() {
            myGameRunning = true;
            myScore = 0;
            drawGame();
        }

        // Move player with arrow keys
        document.addEventListener('keydown', function(event) {
            if (!myGameRunning) return;

            if (event.key === "ArrowLeft") {
                myPlayerX -= 15;
            }

            if (event.key === "ArrowRight") {
                myPlayerX += 15;
            }

            if (event.key === "ArrowUp") {
                myPlayerY -= 15;
            }

            if (event.key === "ArrowDown") {
                myPlayerY += 15;
            }

            // Keep player inside canvas
            myPlayerX = Math.max(0, Math.min(650, myPlayerX));
            myPlayerY = Math.max(40, Math.min(450, myPlayerY));

            drawGame();
        });

        // Draw starting screen
        drawGame();
    </script>

</body>
</html>
